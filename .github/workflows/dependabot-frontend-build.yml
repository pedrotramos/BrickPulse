# The deployed app serves the committed build in src/brickpulse/server/static, so a frontend
# dependency bump must ship with a rebuilt UI. Dependabot can't build, so this workflow does it
# on Dependabot's PRs and commits the result to the PR branch.
name: Rebuild frontend for Dependabot

on:
  pull_request:
    paths:
      - frontend/package.json
      - frontend/package-lock.json

permissions:
  contents: write  # push the rebuilt UI to the PR branch
  actions: write   # start CI on the new commit

concurrency:
  group: dependabot-frontend-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  rebuild:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm --prefix frontend ci
      - name: Build
        run: npm run build
      - name: Commit the rebuilt UI
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref }}
        run: |
          if [ -z "$(git status --porcelain -- src/brickpulse/server/static)" ]; then
            echo "The committed build is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src/brickpulse/server/static
          git commit -m "Rebuild the frontend for the dependency update"
          git push origin "HEAD:$BRANCH"
          # A push made with GITHUB_TOKEN starts no workflow; dispatch CI for the new commit.
          gh workflow run ci.yml --ref "$BRANCH"
